<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Rivals · Flight Arena</title><link rel="stylesheet" href="style.css"><style>body{margin:0}h2,p{margin:.3rem 0}select,input,button{font:inherit}label{display:block;margin:.5rem 0} select{max-width:100%} .fr-shell{padding:clamp(12px,3vw,40px)} .fr-screen{max-width:1120px}.fr-stage{align-self:start}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px} .fr-title{font-size:clamp(28px,5vw,64px)} .fr-sidebar{gap:10px} #state{min-height:1.5em}</style></head>
<body><main class="fr-shell"><section class="fr-screen">
<header><h1 class="fr-title">Flappy Rivals</h1><label>Level <select id="levelSelect" disabled><option value="1">1 · First Rival</option><option value="2">2 · Sound Battle</option><option value="3">3 · Split Paths</option><option value="4">4 · Predictive Rival</option><option value="5">5 · Outsmart the AI</option></select></label></header>
<div class="fr-play-layout"><div><div class="fr-stage"><canvas id="gameCanvas" class="fr-canvas" width="800" height="500" aria-label="Flappy Rivals game arena"></canvas></div><p id="state" role="status">Loading Python…</p><button class="fr-button fr-button--primary" id="pilot" disabled>Start / Flap / Continue</button></div>
<aside class="fr-sidebar"><section class="fr-role fr-pilot"><h2>Pilot</h2><p>Press Space or click the arena to flap. Hitting a pipe ends the round.</p></section>
<section class="fr-role fr-architect"><h2>Architect</h2><p>↑ Narrow · ↓ Open · X Pulse</p><label>Voice control <select id="role"><option value="architect">Architect · Pipes</option><option value="pilot">Pilot · Flap</option></select></label><button id="mic" class="fr-button" disabled>Enable microphone</button><p id="inputStatus">Keyboard mode</p><label>Microphone sensitivity <input id="gain" type="range" min=".25" max="3" step=".05" value="1"></label><label>Volume <progress class="fr-meter" id="volume" max="1" value="0"></progress></label><label>Energy <progress class="fr-meter" id="energy" max="100" value="100"></progress></label><p id="ability"></p></section>
<section class="fr-panel fr-feedback"><h2>AI Forecast</h2><p id="forecast">Forecasts start in Level 4. Bluff detection starts in Level 5.</p></section></aside></div></section></main>
<script type="module" src="boot.js"></script></body></html>
