<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Rivals · Flight Arena</title><link rel="stylesheet" href="style.css"><style>body{margin:0}h2,p{margin:.3rem 0}select,input,button{font:inherit}label{display:block;margin:.5rem 0} select{max-width:100%} .fr-shell{padding:clamp(12px,3vw,40px)} .fr-screen{max-width:1120px}.fr-stage{align-self:start}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px} .fr-title{font-size:clamp(28px,5vw,64px)} .fr-sidebar{gap:10px} #state{min-height:1.5em}</style></head>
<body><main class="fr-shell"><section class="fr-screen">
<header><h1 class="fr-title">Flappy Rivals</h1><label>关卡 <select id="levelSelect" disabled><option value="1">1 · First Rival</option><option value="2">2 · Sound Battle</option><option value="3">3 · Split Paths</option><option value="4">4 · Predictive Rival</option><option value="5">5 · Outsmart the AI</option></select></label></header>
<div class="fr-play-layout"><div><div class="fr-stage"><canvas id="gameCanvas" class="fr-canvas" width="800" height="500" aria-label="Flappy Rivals 游戏画面"></canvas></div><p id="state" role="status">正在加载 Python…</p><button class="fr-button fr-button--primary" id="pilot" disabled>开始 / 拍翅 / 继续</button></div>
<aside class="fr-sidebar"><section class="fr-role fr-pilot"><h2>Pilot</h2><p>Space 或点击画面拍翅。碰到管壁即出局。</p></section>
<section class="fr-role fr-architect"><h2>Architect</h2><p>↑ 收窄 · ↓ 张开 · X 脉冲</p><label>声音控制 <select id="role"><option value="architect">Architect · 管道</option><option value="pilot">Pilot · 拍翅</option></select></label><button id="mic" class="fr-button" disabled>开启麦克风</button><p id="inputStatus">键盘模式</p><label>麦克风灵敏度 <input id="gain" type="range" min=".25" max="3" step=".05" value="1"></label><label>音量 <progress class="fr-meter" id="volume" max="1" value="0"></progress></label><label>能量 <progress class="fr-meter" id="energy" max="100" value="100"></progress></label><p id="ability"></p></section>
<section class="fr-panel fr-feedback"><h2>AI Forecast</h2><p id="forecast">第 4 关开启预测，第 5 关开启 Bluff。</p></section></aside></div></section></main>
<script type="module" src="boot.js"></script></body></html>
